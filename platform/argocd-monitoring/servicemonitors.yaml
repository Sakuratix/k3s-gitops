# Scrape Argo CD's own metrics so the GitOps engine is monitored like everything else.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: argocd
  namespace: monitoring
spec:
  namespaceSelector: { matchNames: [argocd] }
  selector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [argocd-metrics, argocd-server-metrics, argocd-repo-server]
  endpoints:
    - { port: metrics, interval: 30s }
