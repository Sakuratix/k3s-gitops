controller:
  replicaCount: 1
  service:
    type: LoadBalancer      # k3s ServiceLB (klipper) gives it the node IP
  metrics:
    enabled: true
    serviceMonitor: { enabled: true, additionalLabels: { release: kube-prometheus-stack } }
  config:
    use-forwarded-headers: "true"
    enable-real-ip: "true"
