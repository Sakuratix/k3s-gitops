apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"   # after kube-prometheus-stack installs the CRDs
spec:
  project: platform
  source:
    repoURL: https://github.com/Sakuratix/k3s-gitops.git
    targetRevision: main
    path: platform/argocd-monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: { prune: true, selfHeal: true }
