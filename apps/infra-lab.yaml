apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-lab
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: apps
  source:
    repoURL: https://github.com/Sakuratix/infra-lab.git
    targetRevision: main
    path: helm/app
    helm:
      valuesObject:
        ingress: { enabled: true, host: lab.example.com }
        serviceMonitor: { enabled: true }
        # The "apps" project doesn't let workloads ship their own NetworkPolicy (guardrails
        # belong to the platform), so the chart's policy would make every sync fail.
        # The same default-deny policy comes from platform/guardrails instead.
        networkPolicy: { enabled: false }
  destination:
    server: https://kubernetes.default.svc
    namespace: infra-lab
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    retry: { limit: 5, backoff: { duration: 10s, factor: 2, maxDuration: 3m } }
    syncOptions: [CreateNamespace=true]
